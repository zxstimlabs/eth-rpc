# Test suite in Docker, against its own throwaway Redis.
#
#   docker compose -f deploy/compose.test.yaml run --rm --build test
#   docker compose -f deploy/compose.test.yaml down
#
# Separate project name and Redis on purpose: the tests reset counters and
# briefly pause Redis writes, so they must never share a Redis that serves
# traffic. Upstreams are fake (fetch is mocked); values just need to differ
# so the routing test can tell chains apart.

name: zxstim-rpc-test

services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  test:
    build:
      context: ..
      target: test
    environment:
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "1"
      ETHEREUM_RPC_URL: http://upstream.invalid/eth
      ARBITRUM_RPC_URL: http://upstream.invalid/arb
      BASE_RPC_URL: http://upstream.invalid/base
      SEPOLIA_RPC_URL: http://upstream.invalid/sep
      ARBITRUM_SEPOLIA_RPC_URL: http://upstream.invalid/arb-sep
      BASE_SEPOLIA_RPC_URL: http://upstream.invalid/base-sep
    depends_on:
      redis:
        condition: service_healthy
