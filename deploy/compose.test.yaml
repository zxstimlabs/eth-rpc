# Test suite in Docker, against its own throwaway Redis and Postgres.
#
#   docker compose -f deploy/compose.test.yaml run --rm --build test
#   docker compose -f deploy/compose.test.yaml down
#
# Separate project name, Redis and Postgres on purpose: the tests reset
# counters, briefly pause Redis writes, and write accounts and payments, so
# they must never share a Redis or database that serves traffic. Upstreams
# are fake (fetch is mocked); values just need to differ so the routing
# test can tell chains apart.

name: zxstim-rpc-test

services:
  redis:
    image: redis:8.12-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: zxstim
      POSTGRES_PASSWORD: test
      POSTGRES_DB: zxstim_rpc
    command: ["postgres", "-c", "client_min_messages=warning", "-c", "fsync=off"]
    tmpfs: [/var/lib/postgresql] # throwaway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zxstim -d zxstim_rpc"]
      interval: 2s
      timeout: 2s
      retries: 30

  test:
    build:
      context: ..
      target: test
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://zxstim:test@postgres:5432/zxstim_rpc
      TRUST_PROXY: "1"
      ETHEREUM_RPC_URL: http://upstream.invalid/eth
      ARBITRUM_RPC_URL: http://upstream.invalid/arb
      BASE_RPC_URL: http://upstream.invalid/base
      SEPOLIA_RPC_URL: http://upstream.invalid/sep
      ARBITRUM_SEPOLIA_RPC_URL: http://upstream.invalid/arb-sep
      BASE_SEPOLIA_RPC_URL: http://upstream.invalid/base-sep
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
